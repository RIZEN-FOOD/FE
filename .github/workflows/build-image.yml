# 쇼핑몰 화면: main 푸시 → 타입·린트 검사 → Docker 이미지 빌드 → GitHub 패키지(ghcr.io)에 올린다.
#
# 운영 반영은 서버가 한다. 서버의 auto-deploy(2분마다)가 새 latest 이미지를 보고
# 받아서 교체하고, 상태 확인에 실패하면 이전 이미지로 되돌린다 (BE/deploy/auto-deploy.sh).
#
# ★ 사이트 주소는 빌드 때 이미지에 박힌다(sitemap·robots·공유 미리보기 절대 주소).
#   손으로 실행할 때 넣은 값 → 저장소 변수 SITE_URL → 기본값 순서로 쓴다.
name: Build web image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:
    inputs:
      site_url:
        description: "사이트 주소 (비우면 기본 https://www.rizenfoods.com)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-web-image
  cancel-in-progress: false

env:
  SITE_URL: ${{ inputs.site_url || vars.SITE_URL || 'https://www.rizenfoods.com' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: 타입 검사
        run: npm run assets:manifest && npx tsc --noEmit

      - name: 린트
        run: npm run lint

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 사이트 주소 확인
        run: |
          if ! [[ "$SITE_URL" =~ ^https://[a-z0-9.-]+$ ]]; then
            echo "사이트 주소 형식이 이상합니다: '$SITE_URL' (https:// 로 시작, 끝에 / 없이)"
            exit 1
          fi
          echo "사이트 주소: $SITE_URL"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (소문자)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
