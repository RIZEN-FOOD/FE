# 쇼핑몰 화면 Docker 이미지를 빌드해 GitHub 패키지(ghcr.io)에 올린다.
# 운영 서버(Lightsail, x86)에서 docker compose pull 로 받는다 (BE/deploy/README.md).
#
# 지금은 수동 실행만 연다(Actions 탭 → Run workflow).
name: Build web image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-web-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (소문자)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
